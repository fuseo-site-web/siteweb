# Le runtime Next.js de Netlify est détecté automatiquement.
# Les en-têtes de sécurité sont définis dans next.config.ts (une seule source).
# Variables d'environnement : Netlify > Site configuration > Environment variables (voir .env.example).

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[context.production.environment]
  NEXT_PUBLIC_SITE_URL = "https://fuseo.net"

# Une seule redirection vers l'adresse principale, quel que soit le protocole d'origine.
[[redirects]]
  from = "http://www.fuseo.net/*"
  to = "https://fuseo.net/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.fuseo.net/*"
  to = "https://fuseo.net/:splat"
  status = 301
  force = true
